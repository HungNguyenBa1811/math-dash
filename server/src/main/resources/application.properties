# Render provides the port via PORT; 8080 when running locally
server.port=${PORT:8080}
# Include the error message in JSON so the app can show it
server.error.include-message=always
# Serialize dates in JSON as epoch milliseconds
spring.jackson.serialization.write-dates-as-timestamps=true

# MySQL connection, overridden by application-local.properties (a Secret File on Render)
db.url=jdbc:mysql://localhost:3306/mathdash?serverTimezone=Asia/Ho_Chi_Minh
db.user=root
db.password=

# Realtime Database, the server reads and writes matches via its REST API
firebase.databaseUrl=https://math-dash-biden-default-rtdb.asia-southeast1.firebasedatabase.app
