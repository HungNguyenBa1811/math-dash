# Render cấp cổng qua biến PORT; chạy trên máy thì dùng 8080
server.port=${PORT:8080}
# Trả câu thông báo lỗi (message) trong JSON để app hiển thị
server.error.include-message=always
# Ngày giờ trả ra JSON dạng số mili giây
spring.jackson.serialization.write-dates-as-timestamps=true

# Kết nối MySQL. Mật khẩu thật ghi đè trong application-local.properties (không commit),
# hoặc bằng biến môi trường DB_URL, DB_USER, DB_PASSWORD khi chạy trên Render
db.url=jdbc:mysql://localhost:3306/mathdash?serverTimezone=Asia/Ho_Chi_Minh
db.user=root
db.password=

# Realtime Database, server đọc / ghi trận qua REST API
firebase.databaseUrl=https://math-dash-biden-default-rtdb.asia-southeast1.firebasedatabase.app
