server.port=8080
# Trả câu thông báo lỗi (message) trong JSON để app hiển thị
server.error.include-message=always
# Ngày giờ trả ra JSON dạng số mili giây
spring.jackson.serialization.write-dates-as-timestamps=true

# Kết nối MySQL. Mật khẩu thật ghi đè trong application-local.properties (không commit)
db.url=jdbc:mysql://localhost:3306/mathdash?serverTimezone=Asia/Ho_Chi_Minh
db.user=root
db.password=

# Firebase Admin: file service account đặt trong src/main/resources (không commit)
firebase.credentials=/firebase-service-account.json
firebase.databaseUrl=https://YOUR-PROJECT-default-rtdb.firebaseio.com
